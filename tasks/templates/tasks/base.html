<!DOCTYPE html>
{% load static %}
<html>
<head>
  <title>{% block title %}Task Manager{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'task_list' %}">TaskManager</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'task_list' %}">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'add_task' %}">+ New Task</a>
        </li>
        <li class="nav-item">
  <a class="nav-link" href="{% url 'profile' %}">Profile</a>
</li>

        <li class="nav-item">
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="btn btn-sm btn-outline-light">Logout</button>
          </form>
        </li>
        <li class="nav-item">
          <button id="toggleTheme" class="btn btn-sm btn-outline-light ms-2">🌙</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

  <div class="container mt-4">
    {% if messages %}
  <div class="container mt-3">
    {% for message in messages %}
      <div class="alert {{ message.tags }}">{{ message }}</div>
    {% endfor %}
  </div>
{% endif %}

    {% block content %}{% endblock %}
  </div>

  <script>
  const toggleBtn = document.getElementById("toggleTheme");
  const body = document.body;

  // Load saved theme
  if (localStorage.getItem("darkMode") === "true") {
    body.classList.add("dark-mode");
  }

  toggleBtn.addEventListener("click", () => {
    body.classList.toggle("dark-mode");
    localStorage.setItem("darkMode", body.classList.contains("dark-mode"));
  });
</script>

</body>
</html>
